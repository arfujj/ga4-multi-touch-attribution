version: 2
models:
  - name: int_sessions
    description: One row per session with timing, landing page, raw source/medium, device, country, funnel flags and de-duplicated revenue.
    columns:
      - name: session_key
        tests: [not_null, unique]
      - name: user_pseudo_id
        tests: [not_null]
      - name: session_duration_sec
        tests: [not_null]
      - name: revenue_usd
        tests: [not_null]
  - name: int_channel_map
    description: Each observed source/medium mapped to a channel group by the first matching rule in seeds/channel_rules.csv.
    columns:
      - name: source_medium_key
        tests: [not_null, unique]
      - name: channel_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: &channels ['Organic Search', 'Paid Search', 'Direct', 'Referral', 'Email', 'Social', 'Display', 'Other/Unknown']
      - name: rule_name
        tests:
          - relationships:
              arguments:
                to: ref('channel_rules')
                field: rule_name
